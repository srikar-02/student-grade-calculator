<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <!-- Student Name -->
        <label for="studentName">Student Name</label>

        <input
            type="text"
            id="studentName"
            placeholder="Enter your name"
        >


        <!-- Number of Subjects -->
        <label for="subjectCount">Number of Subjects</label>

        <input
            type="number"
            id="subjectCount"
            placeholder="Enter number of subjects"
            min="1"
            max="20"
        >


        <!-- Add Subjects -->
        <button onclick="createSubjects()">
            Add Subjects
        </button>


        <!-- Dynamic Subjects -->
        <div id="subjects"></div>


        <!-- Calculate -->
        <button
            id="calculateButton"
            onclick="calculateGrade()"
            style="display: none;"
        >
            Calculate Result
        </button>


        <!-- Reset -->
        <button
            id="resetButton"
            onclick="resetForm()"
            style="display: none;"
        >
            Reset
        </button>


        <!-- Result -->
        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
